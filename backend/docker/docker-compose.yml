services:
  postgres:
    image: postgres:16
    container_name: trade-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - trade-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trade-postgres-data:
